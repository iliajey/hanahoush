[project]
name = "hanahoush-backend"
version = "0.1.0"
description = "Hanahoush platform backend API"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    "**/migrations/*",
    ".venv",
    "node_modules",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "C4",   # flake8-comprehensions
    "DJ",   # flake8-django
    "S",    # bandit (security)
]
ignore = ["S101"]  # allow assert in tests

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.ci"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
testpaths = ["apps", "config"]
addopts = "--reuse-db --cov=apps --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["apps", "config"]
omit = ["*/migrations/*", "*/tests/*", "*/management/*"]
