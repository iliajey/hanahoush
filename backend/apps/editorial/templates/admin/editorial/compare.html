{% extends "admin/base_site.html" %}
{% block content %}
<h1>Compare revisions — {{ workflow }}</h1>
<p>
  <a href="{% url 'admin:editorial_contentworkflow_change' workflow.pk %}">← Back to workflow</a>
</p>

<form method="get" class="module" style="padding:8px;margin-bottom:12px;">
  From v
  <select name="from">
    {% for r in revisions %}<option value="{{ r.version }}" {% if r.version == from_version %}selected{% endif %}>v{{ r.version }} — {{ r.summary|default:"rev" }}</option>{% endfor %}
  </select>
  &nbsp;To v
  <select name="to">
    {% for r in revisions %}<option value="{{ r.version }}" {% if r.version == to_version %}selected{% endif %}>v{{ r.version }} — {{ r.summary|default:"rev" }}</option>{% endfor %}
  </select>
  <button type="submit" class="button">Compare</button>
</form>

{% if diff_html %}
  <div style="overflow:auto;">{{ diff_html|safe }}</div>
{% else %}
  <p>Select two different revisions to compare.</p>
{% endif %}
