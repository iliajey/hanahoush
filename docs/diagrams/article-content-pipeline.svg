<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" font-family="Inter, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#38bdf8"/></marker>
  </defs>
  <rect width="1280" height="560" fill="url(#bg)"/>
  <text x="40" y="48" fill="#e2e8f0" font-size="24" font-weight="700">Article content pipeline (security-first)</text>

  <rect x="60" y="110" width="280" height="70" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="200" y="142" fill="#e2e8f0" font-size="13" text-anchor="middle" font-weight="600">CKEditor HTML</text>
  <text x="200" y="166" fill="#64748b" font-size="11" text-anchor="middle">description_{fa,en,ar}</text>

  <line x1="340" y1="145" x2="400" y2="145" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="400" y="110" width="280" height="70" rx="12" fill="#1e293b" stroke="#f59e0b"/>
  <text x="540" y="142" fill="#f59e0b" font-size="13" text-anchor="middle" font-weight="600">DOMPurify sanitize</text>
  <text x="540" y="166" fill="#64748b" font-size="11" text-anchor="middle">strips script/on* · blocks javascript:</text>

  <line x1="680" y1="145" x2="740" y2="145" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="740" y="110" width="300" height="70" rx="12" fill="#1e293b" stroke="#10b981"/>
  <text x="890" y="142" fill="#10b981" font-size="13" text-anchor="middle" font-weight="600">Transform</text>
  <text x="890" y="166" fill="#64748b" font-size="11" text-anchor="middle">heading ids (TOC) · code language labels</text>

  <line x1="1040" y1="145" x2="1100" y2="145" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="1100" y="110" width="120" height="70" rx="12" fill="#1e293b" stroke="#38bdf8"/>
  <text x="1160" y="150" fill="#38bdf8" font-size="12" text-anchor="middle" font-weight="600">Render</text>
  <text x="1160" y="170" fill="#64748b" font-size="11" text-anchor="middle">safe HTML</text>

  <rect x="60" y="240" width="1160" height="140" rx="12" fill="#0f172a" stroke="#38bdf8"/>
  <text x="80" y="272" fill="#38bdf8" font-size="14" font-weight="700">Rendering pieces</text>
  <g font-size="12.5" fill="#94a3b8">
    <text x="80" y="300">· ArticleContent → sanitized body + extracted TOC (one pass)</text>
    <text x="80" y="326">· CodeBlock → language label · copy button · horizontal scroll · accessible · lightweight regex highlighter</text>
    <text x="80" y="352">· ReadingProgress (scroll) · ArticleTableOfContents (sticky/collapsible)</text>
  </g>

  <rect x="60" y="400" width="1160" height="100" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="80" y="432" fill="#e2e8f0" font-size="13" font-weight="600">Security guarantees</text>
  <g font-size="12" fill="#94a3b8">
    <text x="80" y="458">· Scripts/event handlers cannot execute · javascript: URLs stripped · draft/archived/scheduled never public (published-only querysets)</text>
    <text x="80" y="482">· No base64 images (MediaFile only) · SEO: BlogPosting + BreadcrumbList JSON-LD validated before injection · canonical deterministic</text>
  </g>
</svg>