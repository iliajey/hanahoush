<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" font-family="Inter, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#38bdf8"/></marker>
  </defs>
  <rect width="1280" height="620" fill="url(#bg)"/>
  <text x="40" y="48" fill="#e2e8f0" font-size="24" font-weight="700">Projects — portfolio data flow</text>

  <rect x="40" y="90" width="360" height="150" rx="14" fill="#1e293b" stroke="#334155"/>
  <text x="60" y="122" fill="#38bdf8" font-size="15" font-weight="700">Django Admin</text>
  <text x="60" y="150" fill="#94a3b8" font-size="12.5">· Project + case_study JSON</text>
  <text x="60" y="172" fill="#94a3b8" font-size="12.5">· gallery (ProjectImage) · technologies</text>
  <text x="60" y="194" fill="#94a3b8" font-size="12.5">· editorial workflow (8C)</text>
  <text x="60" y="216" fill="#94a3b8" font-size="12.5">· Page "projects" + case sections (8B)</text>

  <line x1="400" y1="170" x2="460" y2="170" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="460" y="90" width="360" height="150" rx="14" fill="#1e293b" stroke="#334155"/>
  <text x="480" y="122" fill="#38bdf8" font-size="15" font-weight="700">API (/api/v1/projects)</text>
  <text x="480" y="150" fill="#94a3b8" font-size="12.5">· GET /projects/ (filters: category·technologies</text>
  <text x="480" y="172" fill="#94a3b8" font-size="12.5">  ·year·is_featured·q ·ordering·pagination)</text>
  <text x="480" y="194" fill="#94a3b8" font-size="12.5">· GET /projects/by-slug/{slug}/ (case study)</text>
  <text x="480" y="216" fill="#94a3b8" font-size="12.5">· GET /projects/technologies/ · /categories/</text>

  <line x1="820" y1="170" x2="880" y2="170" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="880" y="90" width="360" height="150" rx="14" fill="#1e293b" stroke="#334155"/>
  <text x="900" y="122" fill="#38bdf8" font-size="15" font-weight="700">src/features/projects</text>
  <text x="900" y="150" fill="#94a3b8" font-size="12.5">· useProjectsFiltered / useProjectBySlug</text>
  <text x="900" y="172" fill="#94a3b8" font-size="12.5">· FeaturedProjectCard · ProjectFilterBar</text>
  <text x="900" y="194" fill="#94a3b8" font-size="12.5">· ArchitectureViewer · ProjectGallery</text>
  <text x="900" y="216" fill="#94a3b8" font-size="12.5">· ProjectsTimeline · Results · SEO</text>

  <rect x="40" y="290" width="1200" height="150" rx="14" fill="#0f172a" stroke="#38bdf8"/>
  <text x="60" y="322" fill="#38bdf8" font-size="14" font-weight="700">Listing page — composed by PageRenderer (Page "projects")</text>
  <g font-size="12.5" fill="#94a3b8">
    <text x="60" y="352">hero → featured_projects → project_filters → technology_explorer → projects_timeline → cta</text>
    <text x="60" y="378">project_filters: server-side filtering (category·technologies·year·q·featured) — no client-side over-fetch</text>
    <text x="60" y="404">technology_explorer: live /projects/technologies/ chips — select → filtered grid</text>
  </g>

  <rect x="40" y="460" width="1200" height="120" rx="14" fill="#1e293b" stroke="#334155"/>
  <text x="60" y="492" fill="#e2e8f0" font-size="14" font-weight="700">Analytics · SEO</text>
  <g font-size="12.5" fill="#94a3b8">
    <text x="60" y="520">project_view · project_filter · project_search · technology_filter · project_cta_click · scroll_depth</text>
    <text x="60" y="546">section_visible (renderer) · useSeoMeta + BreadcrumbList/CreativeWork JSON-LD · canonical · OG</text>
  </g>
</svg>