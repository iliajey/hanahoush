<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" font-family="Inter, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient>
  </defs>
  <rect width="1280" height="520" fill="url(#bg)"/>
  <text x="40" y="48" fill="#e2e8f0" font-size="24" font-weight="700">Article reading flow</text>

  <rect x="60" y="110" width="320" height="60" rx="12" fill="#1e293b" stroke="#38bdf8"/>
  <text x="220" y="146" fill="#f8fafc" font-size="14" text-anchor="middle" font-weight="600">/articles/:slug</text>

  <rect x="420" y="110" width="320" height="60" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="580" y="146" fill="#e2e8f0" font-size="13" text-anchor="middle">useArticleBySlug → safe body + TOC</text>

  <rect x="780" y="110" width="440" height="60" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="1000" y="146" fill="#e2e8f0" font-size="13" text-anchor="middle">ReadingProgress + ArticleContent + CodeBlock</text>

  <g font-size="12.5" fill="#94a3b8">
    <text x="60" y="240">· Reading progress bar (scroll-driven, fixed top)</text>
    <text x="60" y="266">· Table of contents from h2/h3 — sticky sidebar (desktop) / collapsible (mobile)</text>
    <text x="60" y="292">· Code blocks: language label · copy · horizontal scroll · accessible</text>
    <text x="60" y="318">· Comfortable measure (~66ch) — no long lines on desktop; RTL/LTR via LanguageProvider</text>
  </g>

  <rect x="60" y="360" width="1160" height="90" rx="12" fill="#0f172a" stroke="#38bdf8"/>
  <text x="80" y="392" fill="#38bdf8" font-size="14" font-weight="700">End of article</text>
  <g font-size="12.5" fill="#94a3b8">
    <text x="80" y="418">related articles · related projects · related services (server-computed overlap) → newsletter → contextual CTA</text>
    <text x="80" y="440">analytics: article_view · article_section_visible · related clicks · article_cta_click · scroll_depth</text>
  </g>
</svg>