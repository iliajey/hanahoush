<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" font-family="Inter, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#38bdf8"/></marker>
  </defs>
  <rect width="1280" height="620" fill="url(#bg)"/>
  <text x="40" y="48" fill="#e2e8f0" font-size="24" font-weight="700">Approval flow — chain, review, scheduling</text>

  <!-- chain -->
  <g font-size="13">
    <rect x="40" y="120" width="200" height="64" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="140" y="146" fill="#e2e8f0" text-anchor="middle" font-weight="700">Draft</text>
    <text x="140" y="170" fill="#64748b" text-anchor="middle">author writes</text>

    <rect x="320" y="120" width="200" height="64" rx="12" fill="#1e293b" stroke="#f59e0b"/>
    <text x="420" y="146" fill="#f59e0b" text-anchor="middle" font-weight="700">In Review</text>
    <text x="420" y="170" fill="#64748b" text-anchor="middle">Approval #1 (reviewer)</text>

    <rect x="600" y="120" width="200" height="64" rx="12" fill="#1e293b" stroke="#38bdf8"/>
    <text x="700" y="146" fill="#38bdf8" text-anchor="middle" font-weight="700">SEO Review</text>
    <text x="700" y="170" fill="#64748b" text-anchor="middle">Approval #2 (SEO)</text>

    <rect x="880" y="120" width="180" height="64" rx="12" fill="#1e293b" stroke="#10b981"/>
    <text x="970" y="146" fill="#10b981" text-anchor="middle" font-weight="700">Approved</text>
    <text x="970" y="170" fill="#64748b" text-anchor="middle">chain complete</text>
  </g>

  <line x1="240" y1="152" x2="318" y2="152" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="272" y="140" fill="#64748b" font-size="11" text-anchor="middle">submit</text>
  <line x1="520" y1="152" x2="598" y2="152" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="552" y="140" fill="#64748b" font-size="11" text-anchor="middle">approve</text>
  <line x1="800" y1="152" x2="878" y2="152" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="832" y="140" fill="#64748b" font-size="11" text-anchor="middle">approve</text>

  <!-- reject -->
  <path d="M 420 186 C 420 250 340 250 340 190" fill="none" stroke="#f87171" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="365" y="240" fill="#f87171" font-size="11" text-anchor="middle">reject → draft</text>

  <!-- scheduling -->
  <rect x="40" y="280" width="420" height="120" rx="12" fill="#0f172a" stroke="#a78bfa"/>
  <text x="60" y="310" fill="#a78bfa" font-size="14" font-weight="700">Scheduling</text>
  <text x="60" y="336" fill="#94a3b8" font-size="12.5">· approved → schedule(when) → Scheduled</text>
  <text x="60" y="360" fill="#94a3b8" font-size="12.5">· PublicationSchedule row + schedule.created audit</text>
  <text x="60" y="384" fill="#94a3b8" font-size="12.5">· manage.py publish_scheduled → hard publish</text>

  <rect x="500" y="280" width="420" height="120" rx="12" fill="#0f172a" stroke="#34d399"/>
  <text x="520" y="310" fill="#34d399" font-size="14" font-weight="700">Publishing</text>
  <text x="520" y="336" fill="#94a3b8" font-size="12.5">· hard publish → content.status = published</text>
  <text x="520" y="360" fill="#94a3b8" font-size="12.5">· soft publish → is_soft_published (not public)</text>
  <text x="520" y="384" fill="#94a3b8" font-size="12.5">· audit: workflow.publish (old/new stage)</text>

  <rect x="960" y="280" width="280" height="120" rx="12" fill="#0f172a" stroke="#38bdf8"/>
  <text x="980" y="310" fill="#38bdf8" font-size="14" font-weight="700">Review support</text>
  <text x="980" y="336" fill="#94a3b8" font-size="12.5">· threaded comments + mentions</text>
  <text x="980" y="360" fill="#94a3b8" font-size="12.5">· resolve threads</text>
  <text x="980" y="384" fill="#94a3b8" font-size="12.5">· content locks (owner + timeout)</text>

  <!-- api -->
  <rect x="40" y="440" width="1200" height="120" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="60" y="470" fill="#38bdf8" font-size="14" font-weight="700">API — /api/v1/editorial/</text>
  <g font-size="12.5" fill="#94a3b8">
    <text x="60" y="498">workflows/ · workflows/{id}/transition/ · submit-review/ · publish/ · archive/ · reopen/</text>
    <text x="60" y="522">workflows/{id}/revisions/ · revisions/{rid}/rollback/ · diff/?from=&to=</text>
    <text x="60" y="546">workflows/{id}/comments/ · comments/{cid}/resolve/ · approvals/ · approvals/{aid}/decide/ · schedule/</text>
  </g>
</svg>
