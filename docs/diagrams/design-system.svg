<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="Inter, system-ui, sans-serif">
  <rect width="900" height="520" fill="#fafbff"/>
  <text x="30" y="40" font-size="22" font-weight="700" fill="#0f172a">Hanahoush Design System</text>
  <text x="30" y="64" font-size="13" fill="#7f8797">Tokens → Theme Engine → Surfaces → Motion → Components</text>

  <!-- Tokens -->
  <rect x="30" y="100" width="180" height="200" rx="10" fill="#e0e7ff" stroke="#c7d2fe"/>
  <text x="120" y="124" font-size="14" font-weight="700" fill="#3730a3" text-anchor="middle">Tokens</text>
  <text x="120" y="148" font-size="11" fill="#4338ca" text-anchor="middle">colors / typography</text>
  <text x="120" y="166" font-size="11" fill="#4338ca" text-anchor="middle">spacing / radius</text>
  <text x="120" y="184" font-size="11" fill="#4338ca" text-anchor="middle">shadows / elevation</text>
  <text x="120" y="202" font-size="11" fill="#4338ca" text-anchor="middle">gradients / glass</text>
  <text x="120" y="220" font-size="11" fill="#4338ca" text-anchor="middle">motion / icons</text>
  <text x="120" y="238" font-size="11" fill="#4338ca" text-anchor="middle">cursor / effects</text>

  <!-- Theme Engine -->
  <rect x="250" y="100" width="180" height="200" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="340" y="124" font-size="14" font-weight="700" fill="#3730a3" text-anchor="middle">Theme Engine</text>
  <text x="340" y="152" font-size="11" fill="#4338ca" text-anchor="middle">light / dark / system</text>
  <text x="340" y="172" font-size="11" fill="#4338ca" text-anchor="middle">data-theme + dark class</text>
  <text x="340" y="192" font-size="11" fill="#4338ca" text-anchor="middle">animated switching</text>
  <text x="340" y="212" font-size="11" fill="#4338ca" text-anchor="middle">localStorage persist</text>
  <text x="340" y="232" font-size="11" fill="#4338ca" text-anchor="middle">system listener</text>

  <!-- CSS Variables -->
  <rect x="470" y="100" width="180" height="200" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="560" y="124" font-size="14" font-weight="700" fill="#3730a3" text-anchor="middle">CSS Variables</text>
  <text x="560" y="152" font-size="11" fill="#4338ca" text-anchor="middle">--background</text>
  <text x="560" y="172" font-size="11" fill="#4338ca" text-anchor="middle">--ring</text>
  <text x="560" y="192" font-size="11" fill="#4338ca" text-anchor="middle">--glass-*</text>
  <text x="560" y="212" font-size="11" fill="#4338ca" text-anchor="middle">--shadow-*</text>
  <text x="560" y="232" font-size="11" fill="#4338ca" text-anchor="middle">--gradient-*</text>

  <!-- Tailwind mapping -->
  <rect x="690" y="100" width="180" height="200" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="780" y="124" font-size="14" font-weight="700" fill="#3730a3" text-anchor="middle">Tailwind Mapping</text>
  <text x="780" y="152" font-size="11" fill="#4338ca" text-anchor="middle">bg-primary</text>
  <text x="780" y="172" font-size="11" fill="#4338ca" text-anchor="middle">text-muted-foreground</text>
  <text x="780" y="192" font-size="11" fill="#4338ca" text-anchor="middle">rounded-lg</text>
  <text x="780" y="212" font-size="11" fill="#4338ca" text-anchor="middle">shadow-lg</text>
  <text x="780" y="232" font-size="11" fill="#4338ca" text-anchor="middle">glass / glow / grid</text>

  <!-- Arrows -->
  <line x1="210" y1="200" x2="250" y2="200" stroke="#818cf8" stroke-width="2"/>
  <line x1="430" y1="200" x2="470" y2="200" stroke="#818cf8" stroke-width="2"/>
  <line x1="650" y1="200" x2="690" y2="200" stroke="#818cf8" stroke-width="2"/>

  <!-- Runtime layer -->
  <rect x="30" y="340" width="840" height="130" rx="12" fill="#f5f7fa" stroke="#e2e8f0"/>
  <text x="60" y="370" font-size="15" font-weight="700" fill="#0f172a">Runtime Surfaces</text>
  <text x="60" y="394" font-size="12" fill="#7f8797">HanahoushCursor · SiteBackground (grid + noise + mesh + particles) · Effects (glow, glass, border-glow, magnetic, float, tilt, spotlight, reveal)</text>
  <text x="60" y="416" font-size="12" fill="#7f8797">ThemeProvider (animated switch) · Design Playground (/design, dev only) · Storybook token pages</text>
  <text x="60" y="446" font-size="12" fill="#7f8797">Performance: CSS variables first, transform/opacity only, rAF throttled, DPR capped · Accessibility: reduced motion, forced-colors, focus-visible</text>

  <!-- Bottom note -->
  <text x="450" y="500" font-size="11" fill="#7f8797" text-anchor="middle">src/design · tailwind.config.ts · src/styles/globals.css</text>
</svg>
