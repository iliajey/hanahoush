<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" font-family="Inter, sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient>
  </defs>
  <rect width="1280" height="760" fill="url(#bg3)"/>
  <text x="40" y="48" fill="#e2e8f0" font-size="24" font-weight="700">Section Registry</text>
  <text x="40" y="78" fill="#94a3b8" font-size="14">section_type (backend) → lazy React component (frontend registry)</text>

  <!-- Registry box -->
  <rect x="420" y="100" width="440" height="70" rx="14" fill="#1e293b" stroke="#38bdf8"/>
  <text x="640" y="130" fill="#38bdf8" font-size="15" font-weight="700" text-anchor="middle">Section Registry</text>
  <text x="640" y="154" fill="#94a3b8" font-size="12" text-anchor="middle">registry/index.ts · config/index.ts</text>

  <!-- Section chips -->
  <g font-size="12">
    <rect x="40" y="200" width="180" height="34" rx="8" fill="#0f172a" stroke="#334155"/><text x="130" y="222" fill="#e2e8f0" text-anchor="middle">hero</text>
    <rect x="232" y="200" width="180" height="34" rx="8" fill="#0f172a" stroke="#334155"/><text x="322" y="222" fill="#e2e8f0" text-anchor="middle">statistics</text>
    <rect x="424" y="200" width="180" height="34" rx="8" fill="#0f172a" stroke="#334155"/><text x="514" y="222" fill="#e2e8f0" text-anchor="middle">services</text>
    <rect x="616" y="200" width="180" height="34" rx="8" fill="#0f172a" stroke="#334155"/><text x="706" y="222" fill="#e2e8f0" text-anchor="middle">erp</text>
    <rect x="808" y="200" width="180" height="34" rx="8" fill="#0f172a" stroke="#334155"/><text x="898" y="222" fill="#e2e8f0" text-anchor="middle">projects</text>
    <rect x="1000" y="200" width="180" height="34" rx="8" fill="#0f172a" stroke="#334155"/><text x="1090" y="222" fill="#e2e8f0" text-anchor="middle">articles</text>
    <rect x="40" y="244" width="180" height="34" rx="8" fill="#0f172a" stroke="#334155"/><text x="130" y="266" fill="#e2e8f0" text-anchor="middle">about</text>
    <rect x="232" y="244" width="180" height="34" rx="8" fill="#0f172a" stroke="#334155"/><text x="322" y="266" fill="#e2e8f0" text-anchor="middle">team</text>
    <rect x="424" y="244" width="180" height="34" rx="8" fill="#0f172a" stroke="#334155"/><text x="514" y="266" fill="#e2e8f0" text-anchor="middle">timeline</text>
    <rect x="616" y="244" width="180" height="34" rx="8" fill="#0f172a" stroke="#334155"/><text x="706" y="266" fill="#e2e8f0" text-anchor="middle">partners</text>
    <rect x="808" y="244" width="180" height="34" rx="8" fill="#0f172a" stroke="#334155"/><text x="898" y="266" fill="#e2e8f0" text-anchor="middle">testimonials</text>
    <rect x="1000" y="244" width="180" height="34" rx="8" fill="#0f172a" stroke="#334155"/><text x="1090" y="266" fill="#e2e8f0" text-anchor="middle">faq</text>
    <rect x="424" y="288" width="180" height="34" rx="8" fill="#0f172a" stroke="#334155"/><text x="514" y="310" fill="#e2e8f0" text-anchor="middle">cta</text>
    <rect x="616" y="288" width="180" height="34" rx="8" fill="#0f172a" stroke="#334155"/><text x="706" y="310" fill="#e2e8f0" text-anchor="middle">footer</text>
  </g>

  <!-- Resolution -->
  <rect x="40" y="360" width="1200" height="60" rx="10" fill="#0f172a" stroke="#334155"/>
  <text x="60" y="396" fill="#e2e8f0" font-size="13" font-weight="600">isRegisteredSection(type) ? lazy(import(./sections/{Type}Section)) : &lt;UnknownSectionFallback /&gt;</text>

  <!-- Landing composition -->
  <rect x="40" y="460" width="1200" height="70" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="60" y="492" fill="#38bdf8" font-size="14" font-weight="700">Landing page composition (home)</text>
  <text x="60" y="516" fill="#94a3b8" font-size="12.5">hero → statistics → services → projects → articles → about → team → timeline → testimonials → partners → faq → cta</text>

  <!-- Consistency -->
  <g font-size="12.5">
    <rect x="40" y="560" width="380" height="120" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="60" y="592" fill="#e2e8f0" font-weight="600">Lazy loading</text>
    <text x="60" y="616" fill="#94a3b8">React.lazy + Suspense — a section's chunk</text>
    <text x="60" y="638" fill="#94a3b8">only loads when the section renders.</text>
    <text x="60" y="662" fill="#94a3b8">Skeleton shown while loading.</text>

    <rect x="440" y="560" width="380" height="120" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="460" y="592" fill="#e2e8f0" font-weight="700">Safety</text>
    <text x="460" y="616" fill="#94a3b8">Per-section ErrorBoundary · unknown fallback</text>
    <text x="460" y="638" fill="#94a3b8">· DB unique (page, section_type) · renderer</text>
    <text x="460" y="662" fill="#94a3b8">dedupe · enable/disable filtering.</text>

    <rect x="840" y="560" width="400" height="120" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="860" y="592" fill="#e2e8f0" font-weight="700">Observability</text>
    <text x="860" y="616" fill="#94a3b8">Section render analytics (type · status · ms)</text>
    <text x="860" y="638" fill="#94a3b8">visible in /dev/page-builder and console.</text>
    <text x="860" y="662" fill="#94a3b8">Dev console visualises order + lazy status.</text>
  </g>
</svg>