<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" font-family="Inter, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#38bdf8"/></marker>
  </defs>
  <rect width="1280" height="600" fill="url(#bg)"/>
  <text x="40" y="48" fill="#e2e8f0" font-size="24" font-weight="700">Knowledge Hub — articles flow</text>

  <rect x="40" y="90" width="360" height="140" rx="14" fill="#1e293b" stroke="#334155"/>
  <text x="60" y="122" fill="#38bdf8" font-size="15" font-weight="700">Django Admin (CKEditor5)</text>
  <text x="60" y="150" fill="#94a3b8" font-size="12.5">· Article body (HTML) + category/tags/cover</text>
  <text x="60" y="172" fill="#94a3b8" font-size="12.5">· Editorial workflow (8C)</text>
  <text x="60" y="194" fill="#94a3b8" font-size="12.5">· Page "articles" (8B) · Newsletter (new)</text>

  <line x1="400" y1="160" x2="460" y2="160" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="460" y="90" width="360" height="140" rx="14" fill="#1e293b" stroke="#334155"/>
  <text x="480" y="122" fill="#38bdf8" font-size="15" font-weight="700">API (/api/v1/articles)</text>
  <text x="480" y="150" fill="#94a3b8" font-size="12.5">· list: q · category_slug · tags · is_featured</text>
  <text x="480" y="172" fill="#94a3b8" font-size="12.5">· ordering · pagination · reading_time</text>
  <text x="480" y="194" fill="#94a3b8" font-size="12.5">· by-slug (related) · categories/ · tags/</text>

  <line x1="820" y1="160" x2="880" y2="160" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="880" y="90" width="360" height="140" rx="14" fill="#1e293b" stroke="#334155"/>
  <text x="900" y="122" fill="#38bdf8" font-size="15" font-weight="700">src/features/articles</text>
  <text x="900" y="150" fill="#94a3b8" font-size="12.5">· useArticlesFiltered / useArticleBySlug</text>
  <text x="900" y="172" fill="#94a3b8" font-size="12.5">· ArticleContent (DOMPurify) · CodeBlock</text>
  <text x="900" y="194" fill="#94a3b8" font-size="12.5">· TOC · ReadingProgress · NewsletterCTA</text>

  <rect x="40" y="280" width="1200" height="140" rx="14" fill="#0f172a" stroke="#38bdf8"/>
  <text x="60" y="312" fill="#38bdf8" font-size="14" font-weight="700">Listing — composed by PageRenderer (Page "articles")</text>
  <g font-size="12.5" fill="#94a3b8">
    <text x="60" y="342">articles_hero → featured_article → latest_articles → article_filters → category_explorer → tag_explorer → newsletter_cta → article_cta</text>
    <text x="60" y="368">search/filters server-side (q · category_slug · tags · is_featured · ordering · page) — never whole-DB client filtering</text>
    <text x="60" y="394">categories/tags from the API (published-only, with counts)</text>
  </g>

  <rect x="40" y="440" width="1200" height="110" rx="14" fill="#1e293b" stroke="#334155"/>
  <text x="60" y="472" fill="#e2e8f0" font-size="14" font-weight="700">Analytics · SEO</text>
  <g font-size="12.5" fill="#94a3b8">
    <text x="60" y="500">article_view · article_search · article_filter · category_click · tag_click · article_share · copy_link · newsletter_submit</text>
    <text x="60" y="526">related_article/project/service_click · article_cta_click · article_section_visible · scroll_depth</text>
  </g>
</svg>