<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Inter,system-ui,sans-serif">
  <rect width="900" height="400" fill="#fafbff"/>
  <text x="30" y="36" font-size="20" font-weight="700" fill="#0f172a">Animation Flow</text>
  <text x="30" y="56" font-size="12" fill="#7f8797">Scroll → IntersectionObserver → Reveal → Framer Motion → Reduced Motion gate</text>

  <!-- Entry -->
  <rect x="30" y="90" width="180" height="70" rx="10" fill="#e0e7ff" stroke="#c7d2fe"/>
  <text x="120" y="118" font-size="14" font-weight="700" fill="#3730a3" text-anchor="middle">Page load</text>
  <text x="120" y="138" font-size="11" fill="#4338ca" text-anchor="middle">Hero entrance</text>
  <text x="120" y="154" font-size="11" fill="#4338ca" text-anchor="middle">framer-motion stagger</text>

  <!-- Scroll -->
  <rect x="250" y="90" width="180" height="70" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="340" y="118" font-size="14" font-weight="700" fill="#3730a3" text-anchor="middle">Scroll</text>
  <text x="340" y="138" font-size="11" fill="#4338ca" text-anchor="middle">IntersectionObserver</text>
  <text x="340" y="154" font-size="11" fill="#4338ca" text-anchor="middle">threshold 0.15</text>

  <!-- Reveal -->
  <rect x="470" y="90" width="180" height="70" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="560" y="118" font-size="14" font-weight="700" fill="#3730a3" text-anchor="middle">Reveal</text>
  <text x="560" y="138" font-size="11" fill="#4338ca" text-anchor="middle">fade-up 16px</text>
  <text x="560" y="154" font-size="11" fill="#4338ca" text-anchor="middle">400-600ms</text>

  <!-- Cursor -->
  <rect x="690" y="90" width="180" height="70" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="780" y="118" font-size="14" font-weight="700" fill="#3730a3" text-anchor="middle">Cursor</text>
  <text x="780" y="138" font-size="11" fill="#4338ca" text-anchor="middle">rAF lerp</text>
  <text x="780" y="154" font-size="11" fill="#4338ca" text-anchor="middle">GPU transform</text>

  <line x1="210" y1="125" x2="250" y2="125" stroke="#818cf8" stroke-width="2"/>
  <line x1="430" y1="125" x2="470" y2="125" stroke="#818cf8" stroke-width="2"/>
  <line x1="650" y1="125" x2="690" y2="125" stroke="#818cf8" stroke-width="2"/>

  <!-- Gates -->
  <rect x="30" y="210" width="400" height="80" rx="10" fill="#f5f7fa" stroke="#e2e8f0"/>
  <text x="50" y="238" font-size="14" font-weight="700" fill="#0f172a">Reduced Motion Gate</text>
  <text x="50" y="260" font-size="12" fill="#7f8797">prefers-reduced-motion → opacity fades only · no transforms</text>
  <text x="50" y="278" font-size="12" fill="#7f8797">cursor disabled · particles disabled · marquee static</text>

  <rect x="460" y="210" width="410" height="80" rx="10" fill="#f5f7fa" stroke="#e2e8f0"/>
  <text x="480" y="238" font-size="14" font-weight="700" fill="#0f172a">Performance Gate</text>
  <text x="480" y="260" font-size="12" fill="#7f8797">hardwareConcurrency &lt; 4 → cursor/parallax reduced</text>
  <text x="480" y="278" font-size="12" fill="#7f8797">CSS variables first · transform/opacity only · DPR capped</text>

  <!-- Tech -->
  <rect x="30" y="320" width="840" height="50" rx="10" fill="#e0e7ff" stroke="#c7d2fe"/>
  <text x="50" y="346" font-size="12" fill="#4338ca">Framer Motion (mount/scroll) · CSS IntersectionObserver (reveal) · CSS variables (theme) · GSAP (future parallax) · 13 sections · 60 FPS target</text>
</svg>