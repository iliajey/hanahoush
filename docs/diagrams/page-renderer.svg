<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Inter, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#38bdf8"/></marker>
  </defs>
  <rect width="1280" height="720" fill="url(#bg2)"/>
  <text x="40" y="48" fill="#e2e8f0" font-size="24" font-weight="700">PageRenderer — dynamic composition</text>

  <!-- Input -->
  <rect x="40" y="90" width="360" height="120" rx="14" fill="#1e293b" stroke="#38bdf8"/>
  <text x="60" y="120" fill="#38bdf8" font-size="14" font-weight="700">Page JSON (from /api/v1/pages/{slug}/)</text>
  <text x="60" y="148" fill="#94a3b8" font-size="12.5">sections[]: { type, order, is_enabled, config }</text>
  <text x="60" y="172" fill="#94a3b8" font-size="12.5">seo: { meta_title, meta_description, … }</text>
  <text x="60" y="196" fill="#94a3b8" font-size="12.5">version: N · version_at: timestamp</text>

  <line x1="400" y1="150" x2="460" y2="150" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow2)"/>

  <!-- Renderer -->
  <rect x="460" y="90" width="360" height="180" rx="14" fill="#1e293b" stroke="#334155"/>
  <text x="480" y="122" fill="#e2e8f0" font-size="15" font-weight="700">&lt;PageRenderer /&gt;</text>
  <text x="480" y="152" fill="#94a3b8" font-size="12.5">1. filter enabled sections</text>
  <text x="480" y="176" fill="#94a3b8" font-size="12.5">2. dedupe section types</text>
  <text x="480" y="200" fill="#94a3b8" font-size="12.5">3. order by sort_order</text>
  <text x="480" y="224" fill="#94a3b8" font-size="12.5">4. analytics (timing per section)</text>
  <rect x="480" y="238" width="220" height="26" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="590" y="256" fill="#38bdf8" font-size="11" text-anchor="middle">registered section → lazy import</text>

  <!-- Section slots -->
  <rect x="880" y="70" width="360" height="120" rx="12" fill="#0f172a" stroke="#38bdf8"/>
  <text x="900" y="100" fill="#e2e8f0" font-size="13" font-weight="600">SectionSlot 1 — hero</text>
  <text x="900" y="124" fill="#94a3b8" font-size="12">Suspense(fallback=Skeleton) → HeroSection</text>
  <text x="900" y="148" fill="#94a3b8" font-size="12">SectionBoundary · data-section-type="hero"</text>
  <text x="900" y="172" fill="#64748b" font-size="11">analytics: loaded · 38 ms</text>

  <rect x="880" y="210" width="360" height="120" rx="12" fill="#0f172a" stroke="#38bdf8"/>
  <text x="900" y="240" fill="#e2e8f0" font-size="13" font-weight="600">SectionSlot 2 — services</text>
  <text x="900" y="264" fill="#94a3b8" font-size="12">Suspense(fallback=Skeleton) → ServicesSection</text>
  <text x="900" y="288" fill="#94a3b8" font-size="12">SectionBoundary · data-section-type="services"</text>
  <text x="900" y="312" fill="#64748b" font-size="11">analytics: loaded · 52 ms</text>

  <rect x="880" y="350" width="360" height="120" rx="12" fill="#0f172a" stroke="#38bdf8"/>
  <text x="900" y="380" fill="#e2e8f0" font-size="13" font-weight="600">SectionSlot 3 — unknown "x-1"</text>
  <text x="900" y="404" fill="#94a3b8" font-size="12">not registered → UnknownSectionFallback</text>
  <text x="900" y="428" fill="#94a3b8" font-size="12">page keeps rendering (no crash)</text>
  <text x="900" y="452" fill="#64748b" font-size="11">analytics: fallback · 2 ms</text>

  <line x1="820" y1="150" x2="880" y2="130" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="820" y1="150" x2="880" y2="270" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="820" y1="150" x2="880" y2="410" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- Legend -->
  <rect x="40" y="470" width="1200" height="180" rx="14" fill="#1e293b" stroke="#334155"/>
  <text x="60" y="500" fill="#e2e8f0" font-size="15" font-weight="600">Behaviour</text>
  <g font-size="12.5" fill="#94a3b8">
    <text x="60" y="530">· Disabled sections are excluded server-side and skipped client-side.</text>
    <text x="60" y="554">· Duplicate section types collapse to the first occurrence (DB unique constraint enforces it too).</text>
    <text x="60" y="578">· Every section is code-split (React.lazy) — only rendered sections load their chunk.</text>
    <text x="60" y="602">· A section crash is contained by SectionBoundary (local fallback, page survives).</text>
    <text x="60" y="626">· Render analytics (type, status, duration) feed /dev/page-builder and console logging in dev.</text>
  </g>
</svg>
