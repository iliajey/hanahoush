<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Inter, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#38bdf8"/></marker>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <text x="40" y="48" fill="#e2e8f0" font-size="24" font-weight="700">Editorial workflow — state machine</text>

  <g font-size="13">
    <!-- draft -->
    <rect x="40" y="120" width="170" height="60" rx="12" fill="#1e293b" stroke="#94a3b8"/>
    <text x="125" y="145" fill="#e2e8f0" text-anchor="middle" font-weight="700">Draft</text>
    <text x="125" y="166" fill="#64748b" text-anchor="middle">initial</text>
    <!-- in_review -->
    <rect x="300" y="120" width="190" height="60" rx="12" fill="#1e293b" stroke="#f59e0b"/>
    <text x="395" y="145" fill="#f59e0b" text-anchor="middle" font-weight="700">In Review</text>
    <text x="395" y="166" fill="#64748b" text-anchor="middle">approval: review</text>
    <!-- seo_review -->
    <rect x="580" y="120" width="190" height="60" rx="12" fill="#1e293b" stroke="#38bdf8"/>
    <text x="675" y="145" fill="#38bdf8" text-anchor="middle" font-weight="700">SEO Review</text>
    <text x="675" y="166" fill="#64748b" text-anchor="middle">approval: seo</text>
    <!-- approved -->
    <rect x="860" y="120" width="180" height="60" rx="12" fill="#1e293b" stroke="#10b981"/>
    <text x="950" y="145" fill="#10b981" text-anchor="middle" font-weight="700">Approved</text>
    <text x="950" y="166" fill="#64748b" text-anchor="middle">ready to schedule</text>
    <!-- scheduled -->
    <rect x="40" y="300" width="180" height="60" rx="12" fill="#1e293b" stroke="#a78bfa"/>
    <text x="130" y="325" fill="#a78bfa" text-anchor="middle" font-weight="700">Scheduled</text>
    <text x="130" y="346" fill="#64748b" text-anchor="middle">PublicationSchedule</text>
    <!-- published -->
    <rect x="320" y="300" width="190" height="60" rx="12" fill="#1e293b" stroke="#34d399"/>
    <text x="415" y="325" fill="#34d399" text-anchor="middle" font-weight="700">Published</text>
    <text x="415" y="346" fill="#64748b" text-anchor="middle">hard or soft publish</text>
    <!-- archived -->
    <rect x="610" y="300" width="180" height="60" rx="12" fill="#1e293b" stroke="#64748b"/>
    <text x="700" y="325" fill="#94a3b8" text-anchor="middle" font-weight="700">Archived</text>
    <text x="700" y="346" fill="#64748b" text-anchor="middle">terminal</text>
  </g>

  <!-- transitions -->
  <line x1="210" y1="150" x2="298" y2="150" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="245" y="140" fill="#64748b" font-size="11" text-anchor="middle">submit</text>
  <line x1="490" y1="150" x2="578" y2="150" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="525" y="140" fill="#64748b" font-size="11" text-anchor="middle">approve review</text>
  <line x1="770" y1="150" x2="858" y2="150" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="805" y="140" fill="#64748b" font-size="11" text-anchor="middle">approve seo</text>
  <line x1="950" y1="182" x2="130" y2="298" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="580" y="228" fill="#64748b" font-size="11" text-anchor="middle">schedule</text>
  <line x1="220" y1="330" x2="318" y2="330" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="262" y="320" fill="#64748b" font-size="11" text-anchor="middle">publish</text>
  <line x1="510" y1="330" x2="608" y2="330" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="552" y="320" fill="#64748b" font-size="11" text-anchor="middle">archive</text>
  <!-- reopen -->
  <path d="M 700 362 C 700 440 120 440 120 362" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="410" y="430" fill="#64748b" font-size="11" text-anchor="middle">reopen → draft</text>
  <!-- send back -->
  <line x1="395" y1="182" x2="395" y2="300" stroke="#f87171" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="410" y="250" fill="#f87171" font-size="11">send back to draft</text>

  <!-- service layer -->
  <rect x="860" y="300" width="360" height="150" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="880" y="330" fill="#38bdf8" font-size="14" font-weight="700">apps/editorial/services.py</text>
  <text x="880" y="356" fill="#94a3b8" font-size="12">WorkflowService: transition · submit · publish</text>
  <text x="880" y="378" fill="#94a3b8" font-size="12">ApprovalService: decide · LockService · CommentService</text>
  <text x="880" y="400" fill="#94a3b8" font-size="12">RevisionService: snapshot · rollback · diff</text>
  <text x="880" y="422" fill="#94a3b8" font-size="12">ScheduleService: publish_due · AuditService: record</text>

  <!-- model list -->
  <text x="40" y="520" fill="#e2e8f0" font-size="15" font-weight="600">Models (apps/editorial)</text>
  <g font-size="12" fill="#94a3b8">
    <text x="40" y="548">WorkflowStage · ContentWorkflow · ContentRevision · ReviewComment · Approval</text>
    <text x="40" y="572">PublicationSchedule · AuditEvent · ContentLock</text>
    <text x="40" y="600" fill="#64748b">Generic attachment: ContentType + object_id → works with Article, Project, Service, Page, …</text>
  </g>
</svg>
