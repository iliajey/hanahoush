<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" font-family="Inter, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#38bdf8"/></marker>
  </defs>
  <rect width="1280" height="560" fill="url(#bg)"/>
  <text x="40" y="48" fill="#e2e8f0" font-size="24" font-weight="700">Revision chain — snapshots, rollback, diff</text>

  <g font-size="13">
    <rect x="60" y="140" width="220" height="70" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="170" y="168" fill="#e2e8f0" text-anchor="middle" font-weight="700">v1 — Draft snapshot</text>
    <text x="170" y="192" fill="#64748b" text-anchor="middle">title_en: "Editorial Article"</text>

    <rect x="380" y="140" width="220" height="70" rx="12" fill="#1e293b" stroke="#38bdf8"/>
    <text x="490" y="168" fill="#e2e8f0" text-anchor="middle" font-weight="700">v2 — In Review snapshot</text>
    <text x="490" y="192" fill="#64748b" text-anchor="middle">title_en: "Changed Title"</text>

    <rect x="700" y="140" width="220" height="70" rx="12" fill="#1e293b" stroke="#34d399"/>
    <text x="810" y="168" fill="#e2e8f0" text-anchor="middle" font-weight="700">v3 — Rollback snapshot</text>
    <text x="810" y="192" fill="#64748b" text-anchor="middle">title_en restored</text>
  </g>

  <line x1="280" y1="175" x2="378" y2="175" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="320" y="162" fill="#64748b" font-size="11" text-anchor="middle">transition</text>
  <line x1="600" y1="175" x2="698" y2="175" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="640" y="162" fill="#64748b" font-size="11" text-anchor="middle">rollback v2→v1</text>

  <!-- diff panel -->
  <rect x="60" y="280" width="860" height="150" rx="12" fill="#0f172a" stroke="#38bdf8"/>
  <text x="80" y="312" fill="#38bdf8" font-size="14" font-weight="700">diff_snapshots(v1, v2)</text>
  <g font-size="12.5">
    <rect x="80" y="330" width="820" height="34" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="100" y="352" fill="#34d399">added</text><text x="170" y="352" fill="#e2e8f0">field: is_featured  →  true</text>
    <rect x="80" y="372" width="820" height="34" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="100" y="394" fill="#f87171">removed</text><text x="170" y="394" fill="#e2e8f0">field: tags  →  ["django"]</text>
    <text x="80" y="420" fill="#fbbf24">changed · field: title_en  —  "Editorial Article" → "Changed Title"</text>
  </g>

  <!-- guarantees -->
  <g font-size="12.5" fill="#94a3b8">
    <rect x="960" y="140" width="280" height="290" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="980" y="172" fill="#e2e8f0" font-weight="600">Guarantees</text>
    <text x="980" y="200">· snapshots read a fresh row</text>
    <text x="980" y="224">· revisions are immutable</text>
    <text x="980" y="248">· rollback creates a new version</text>
    <text x="980" y="272">· unique (workflow, version)</text>
    <text x="980" y="296">· audit: revision.created / rollback</text>
    <text x="980" y="320">· admin compare view (difflib)</text>
    <text x="980" y="344">· API: /diff/?from=&to=</text>
    <text x="980" y="368">· frontend DiffViewer renders it</text>
  </g>
</svg>
