<line x1="24" y1="580" x2="876" y2="580" stroke="#E9DFEA" stroke-width="1"/><text x="24" y="596" font-size="11" class="cap">Section annotation is centralized: PageRenderer adds data-visual-state per section type (visualStateForSectionType).</text><text x="24" y="612" font-size="11" class="cap">VisualStateProvider (IntersectionObserver) publishes --vs-* on &lt;html&gt;; the background consumes them with 700ms transitions (on &lt;html&gt;).</text><text x="24" y="628" font-size="11" class="cap">No component-level page hacks — the story is token-driven and reusable.</text></svg>