<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620"><title>Scroll visual states</title><style>text{font-family='system-ui, Segoe UI, sans-serif'} .cap{fill:#7E5691} .h{font-weight:700} .mono{font-family:ui-monospace,Consolas,monospace}</style><rect width="900" height="620" fill="#ffffff"/><rect x="0" y="0" width="900" height="620" fill="#FDFBFC" /><text x="24" y="34" class="h" font-size="20">Scroll visual states</text><text x="24" y="54" font-size="12" class="cap">MOCKUP — token-accurate render, NOT a browser screenshot</text><line x1="24" y1="68" x2="876" y2="68" stroke="#E9DFEA" stroke-width="1"/><pattern id="sg" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M 48 0 L 0 0 0 48" fill="none" stroke="#E9DFEA" stroke-width="1"/></pattern>
