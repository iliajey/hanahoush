<line x1="24" y1="440" x2="876" y2="440" stroke="#E9DFEA" stroke-width="1"/><text x="24" y="456" font-size="11" class="cap">Architecture: .hh-backdrop (fixed, oversized for parallax) &gt; .hh-grid-scale (CSS pan) + .hh-grid-energy + .hh-mesh + Particles.</text><text x="24" y="472" font-size="11" class="cap">Visual-state CSS variables: --vs-grid-size · --vs-grid-scale · --vs-energy-* · --vs-mesh-opacity (provider: VisualStateProvider).</text><text x="24" y="488" font-size="11" class="cap">Parallax/pointer nudge: transform-only, rAF, stops when settled; disabled on touch / reduced-motion / low-concurrency.</text></svg>