<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" font-family="Inter, Vazirmatn, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient>
  </defs>
  <rect width="1280" height="900" fill="url(#bg)"/>
  <text x="40" y="48" fill="#e2e8f0" font-size="24" font-weight="700">/services — Enterprise Services Experience (Phase 8D)</text>
  <text x="40" y="78" fill="#94a3b8" font-size="14">Composed by the Page Builder from GET /api/v1/pages/services/ — no hardcoded layout.</text>

  <!-- sections -->
  <g>
    <rect x="40" y="100" width="1200" height="54" rx="10" fill="#1e293b" stroke="#38bdf8"/>
    <text x="70" y="134" fill="#f8fafc" font-size="15" font-weight="600">1 · Hero — cinematic heading · animated bg · living cursor</text>

    <rect x="40" y="162" width="1200" height="54" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="70" y="196" fill="#f8fafc" font-size="15" font-weight="600">2 · Service Journey</text>
    <text x="420" y="196" fill="#38bdf8" font-size="12.5">Problem → Solution → Technology → Result (reveal on scroll)</text>

    <rect x="40" y="224" width="1200" height="96" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="70" y="252" fill="#f8fafc" font-size="15" font-weight="600">3 · Core Services — 7 disciplines (icon · tags · CTA)</text>
    <text x="70" y="280" fill="#94a3b8" font-size="12">Software Dev · ERP · hanRP · Odoo · AI Automation · Web Apps · Consulting</text>
    <text x="70" y="304" fill="#64748b" font-size="11.5">config.items = 7 · e.g. {icon:code, title, tags:[Python,Django,React], cta:{href:/contact}}</text>

    <rect x="40" y="328" width="1200" height="54" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="70" y="362" fill="#f8fafc" font-size="15" font-weight="600">4 · Comparison ✗ Traditional  VS  ✓ Hanahoush</text>

    <rect x="40" y="390" width="1200" height="54" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="70" y="424" fill="#f8fafc" font-size="15" font-weight="600">5 · Technology Stack (animated)</text>
    <text x="420" y="424" fill="#38bdf8" font-size="12.5">Python · Django · React · TS · PostgreSQL · Redis · Kubernetes · Odoo — 12</text>

    <rect x="40" y="452" width="1200" height="54" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="70" y="486" fill="#f8fafc" font-size="15" font-weight="600">6 · Process — Discovery → Planning → Architecture → Development → Testing → Deployment → Support</text>

    <rect x="40" y="514" width="1200" height="54" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="70" y="548" fill="#f8fafc" font-size="15" font-weight="600">7 · FAQ (CMS) · 8 · Related Projects (CMS) · 9 · Related Articles (CMS)</text>

    <rect x="40" y="576" width="1200" height="54" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="70" y="610" fill="#f8fafc" font-size="15" font-weight="600">10 · Final CTA — cta_click tracked</text>
  </g>

  <!-- analytics + dev console -->
  <rect x="40" y="660" width="1200" height="150" rx="12" fill="#0f172a" stroke="#38bdf8"/>
  <text x="60" y="692" fill="#38bdf8" font-size="14" font-weight="700">/dev/services — payload · rendered sections · analytics</text>
  <g font-size="12.5" fill="#94a3b8">
    <text x="60" y="720">section_visible (IntersectionObserver · per section, once)</text>
    <text x="60" y="744">cta_click (primary/secondary with label) · accordion_open (FAQ item)</text>
    <text x="60" y="768">scroll_depth at 25/50/75/100% (passive scroll listener)</text>
    <text x="60" y="792">render analytics: hero/journey/services/comparison/stack/process/faq/projects/articles/cta · type · status · ms</text>
  </g>

  <text x="40" y="846" fill="#64748b" font-size="12">Quality: responsive ✓ · all data from CMS ✓ · Storybook ✓ · accessibility (badges/icons/text) ✓ · no console errors ✓ · no layout shifts ✓</text>
  <text x="40" y="872" fill="#64748b" font-size="12">Backend 113 tests · Frontend 85 tests · tsc · eslint · vite · storybook · ruff ✓</text>
</svg>