<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" font-family="Inter, Vazirmatn, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="900" fill="url(#bg)"/>
  <text x="40" y="52" fill="#e2e8f0" font-size="26" font-weight="700">Home page — CMS data flow (Phase 8A)</text>
  <text x="40" y="80" fill="#94a3b8" font-size="15">Every content section is served by the Django API via React Query hooks. No mock data.</text>

  <!-- Hero -->
  <g>
    <rect x="40" y="104" width="1200" height="120" rx="14" fill="#1e293b" stroke="#334155"/>
    <text x="70" y="142" fill="#f8fafc" font-size="19" font-weight="600">1 · Hero</text>
    <text x="70" y="168" fill="#94a3b8" font-size="14">eyebrow ← <tspan fill="#38bdf8">useSiteSettings().tagline</tspan> · headline/subtitle ← i18n copy</text>
    <text x="70" y="192" fill="#38bdf8" font-size="13">GET /api/v1/site-settings/  ·  Accept-Language: fa|en|ar</text>
    <circle cx="1080" cy="160" r="16" fill="#059669"/><text x="1080" y="165" fill="#fff" font-size="13" text-anchor="middle" font-weight="700">API</text>
  </g>

  <!-- Stats -->
  <g>
    <rect x="40" y="240" width="1200" height="96" rx="14" fill="#1e293b" stroke="#334155"/>
    <text x="70" y="278" fill="#f8fafc" font-size="19" font-weight="600">2 · Statistics (live counts)</text>
    <text x="70" y="304" fill="#94a3b8" font-size="14">projects/articles counts ← pagination metadata · team/partners ← list lengths</text>
    <text x="70" y="326" fill="#38bdf8" font-size="13">GET /projects/ · /articles/ · /team/ · /partners/</text>
  </g>

  <!-- Services -->
  <g>
    <rect x="40" y="352" width="1200" height="120" rx="14" fill="#1e293b" stroke="#334155"/>
    <text x="70" y="390" fill="#f8fafc" font-size="19" font-weight="600">3 · Services</text>
    <text x="70" y="416" fill="#94a3b8" font-size="14"><tspan fill="#f8fafc">ServiceGrid</tspan> ← <tspan fill="#38bdf8">useServices()</tspan> → mapServices → ServiceCard (icon, title, description)</text>
    <text x="70" y="440" fill="#38bdf8" font-size="13">GET /api/v1/services/  ·  skeleton while loading · EmptyState when empty · ErrorState on failure</text>
    <circle cx="1080" cy="410" r="16" fill="#059669"/><text x="1080" y="415" fill="#fff" font-size="13" text-anchor="middle" font-weight="700">API</text>
  </g>

  <!-- Projects -->
  <g>
    <rect x="40" y="488" width="1200" height="96" rx="14" fill="#1e293b" stroke="#334155"/>
    <text x="70" y="526" fill="#f8fafc" font-size="19" font-weight="600">4 · Featured projects</text>
    <text x="70" y="552" fill="#94a3b8" font-size="14"><tspan fill="#f8fafc">ProjectGrid</tspan> ← <tspan fill="#38bdf8">useFeaturedProjects()</tspan> → ProjectCard (image lazy, tags, client)</text>
    <text x="70" y="574" fill="#38bdf8" font-size="13">GET /api/v1/projects/?is_featured=true  ·  images via ResponsiveImage (lazy + SVG fallback)</text>
  </g>

  <!-- Articles -->
  <g>
    <rect x="40" y="600" width="1200" height="96" rx="14" fill="#1e293b" stroke="#334155"/>
    <text x="70" y="638" fill="#f8fafc" font-size="19" font-weight="600">5 · Featured articles</text>
    <text x="70" y="664" fill="#94a3b8" font-size="14"><tspan fill="#f8fafc">ArticleGrid</tspan> ← <tspan fill="#38bdf8">useFeaturedArticles()</tspan> → ArticleCard (category, date, read time)</text>
    <text x="70" y="686" fill="#38bdf8" font-size="13">GET /api/v1/articles/?is_featured=true</text>
  </g>

  <!-- About + Team -->
  <g>
    <rect x="40" y="712" width="1200" height="96" rx="14" fill="#1e293b" stroke="#334155"/>
    <text x="70" y="750" fill="#f8fafc" font-size="19" font-weight="600">6 · About + 7 · Team</text>
    <text x="70" y="776" fill="#94a3b8" font-size="14"><tspan fill="#f8fafc">mission/vision</tspan> ← <tspan fill="#38bdf8">useAbout()</tspan> · <tspan fill="#f8fafc">members</tspan> ← <tspan fill="#38bdf8">useTeam()</tspan></text>
    <text x="70" y="798" fill="#38bdf8" font-size="13">GET /api/v1/about/ · /api/v1/team/</text>
  </g>
  <text x="40" y="860" fill="#64748b" font-size="14">Sections 8–13 (timeline, testimonials, partners, FAQ, CTA, footer) follow the same pattern → hooks → mappers → marketing components.</text>
</svg>
