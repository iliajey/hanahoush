<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" font-family="Inter, Vazirmatn, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="760" fill="url(#bg2)"/>
  <text x="40" y="52" fill="#e2e8f0" font-size="26" font-weight="700">/dev/api — API development console</text>
  <text x="40" y="80" fill="#94a3b8" font-size="15">Shows every endpoint, request timing, React Query cache state and per-query status. DEV-only route.</text>

  <!-- Summary bar -->
  <rect x="40" y="104" width="1200" height="70" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="70" y="138" fill="#f8fafc" font-size="15" font-weight="600">Locale: en</text>
  <text x="250" y="138" fill="#f8fafc" font-size="15" font-weight="600">Cached queries: 14</text>
  <text x="520" y="138" fill="#34d399" font-size="15" font-weight="700">Success: 14</text>
  <text x="700" y="138" fill="#fbbf24" font-size="15" font-weight="700">Fetching: 0</text>
  <text x="880" y="138" fill="#f87171" font-size="15" font-weight="700">Errors: 0</text>
  <rect x="1010" y="112" width="90" height="34" rx="8" fill="#38bdf8"/><text x="1055" y="134" fill="#0f172a" font-size="14" text-anchor="middle" font-weight="700">Run all</text>
  <rect x="1112" y="112" width="108" height="34" rx="8" fill="#334155"/><text x="1166" y="134" fill="#e2e8f0" font-size="13" text-anchor="middle">Clear timings</text>

  <!-- Endpoint cards -->
  <text x="40" y="212" fill="#e2e8f0" font-size="18" font-weight="600">Endpoints</text>
  <g font-size="13">
    <rect x="40" y="224" width="390" height="96" rx="10" fill="#1e293b" stroke="#334155"/>
    <rect x="60" y="242" width="52" height="22" rx="6" fill="#0ea5e9"/><text x="86" y="258" fill="#fff" text-anchor="middle" font-weight="700">GET</text>
    <text x="124" y="257" fill="#e2e8f0">/api/v1/articles/</text>
    <text x="60" y="286" fill="#94a3b8">Published articles · hooks: useArticles</text>
    <rect x="60" y="298" width="52" height="20" rx="6" fill="#059669"/><text x="86" y="313" fill="#fff" text-anchor="middle" font-size="11">OK · 43 ms</text>

    <rect x="445" y="224" width="390" height="96" rx="10" fill="#1e293b" stroke="#334155"/>
    <rect x="465" y="242" width="52" height="22" rx="6" fill="#0ea5e9"/><text x="491" y="258" fill="#fff" text-anchor="middle" font-weight="700">GET</text>
    <text x="529" y="257" fill="#e2e8f0">/api/v1/projects/</text>
    <text x="465" y="286" fill="#94a3b8">Published projects · hooks: useProjects</text>
    <rect x="465" y="298" width="52" height="20" rx="6" fill="#059669"/><text x="491" y="313" fill="#fff" text-anchor="middle" font-size="11">OK · 61 ms</text>

    <rect x="850" y="224" width="390" height="96" rx="10" fill="#1e293b" stroke="#334155"/>
    <rect x="870" y="242" width="52" height="22" rx="6" fill="#0ea5e9"/><text x="896" y="258" fill="#fff" text-anchor="middle" font-weight="700">GET</text>
    <text x="934" y="257" fill="#e2e8f0">/api/v1/site-settings/</text>
    <text x="870" y="286" fill="#94a3b8">Site settings singleton · useSiteSettings</text>
    <rect x="870" y="298" width="52" height="20" rx="6" fill="#059669"/><text x="896" y="313" fill="#fff" text-anchor="middle" font-size="11">OK · 29 ms</text>

    <rect x="40" y="332" width="390" height="96" rx="10" fill="#1e293b" stroke="#334155"/>
    <rect x="60" y="350" width="52" height="22" rx="6" fill="#0ea5e9"/><text x="86" y="366" fill="#fff" text-anchor="middle" font-weight="700">GET</text>
    <text x="124" y="365" fill="#e2e8f0">/api/v1/faqs/</text>
    <text x="60" y="394" fill="#94a3b8">FAQ entries · hooks: useFAQs</text>
    <rect x="60" y="406" width="52" height="20" rx="6" fill="#059669"/><text x="86" y="421" fill="#fff" text-anchor="middle" font-size="11">OK · 33 ms</text>
  </g>

  <!-- Request timing table -->
  <text x="40" y="474" fill="#e2e8f0" font-size="18" font-weight="600">Request timing</text>
  <rect x="40" y="488" width="1200" height="120" rx="10" fill="#1e293b" stroke="#334155"/>
  <g font-size="13">
    <text x="70" y="520" fill="#94a3b8" font-weight="600">METHOD</text><text x="180" y="520" fill="#94a3b8" font-weight="600">PATH</text><text x="620" y="520" fill="#94a3b8" font-weight="600">STATUS</text><text x="760" y="520" fill="#94a3b8" font-weight="600">DURATION</text><text x="900" y="520" fill="#94a3b8" font-weight="600">STARTED</text>
    <text x="70" y="552" fill="#0ea5e9">GET</text><text x="180" y="552" fill="#e2e8f0">/api/v1/articles/?is_featured=true</text><text x="620" y="552" fill="#34d399">200</text><text x="760" y="552" fill="#e2e8f0">43 ms</text><text x="900" y="552" fill="#94a3b8">16:01:22</text>
    <text x="70" y="578" fill="#0ea5e9">GET</text><text x="180" y="578" fill="#e2e8f0">/api/v1/navigation/</text><text x="620" y="578" fill="#34d399">200</text><text x="760" y="578" fill="#e2e8f0">28 ms</text><text x="900" y="578" fill="#94a3b8">16:01:22</text>
    <text x="70" y="604" fill="#0ea5e9">GET</text><text x="180" y="604" fill="#e2e8f0">/api/v1/footer/</text><text x="620" y="604" fill="#34d399">200</text><text x="760" y="604" fill="#e2e8f0">30 ms</text><text x="900" y="604" fill="#94a3b8">16:01:22</text>
  </g>
</svg>
