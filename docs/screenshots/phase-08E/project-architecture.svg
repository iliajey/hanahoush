  </g>

  <rect x="120" y="210" width="12" height="40" fill="#334155"/>
  <rect x="540" y="250" width="12" height="40" fill="#334155"/>
  <rect x="920" y="210" width="12" height="40" fill="#334155"/>

  <text x="40" y="470" fill="#e2e8f0" font-size="16" font-weight="700">Data-driven &amp; honest</text>
  <g font-size="13" fill="#94a3b8">
    <text x="40" y="502">· Only layers/nodes present in Project.case_study.architecture are rendered.</text>
    <text x="40" y="528">· Labels resolve per language; shape-agnostic (string[] or {en:[…]}).</text>
    <text x="40" y="554">· No architecture data → clean fallback message (never invented).</text>
