<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" font-family="Inter, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient>
  </defs>
  <rect width="1280" height="600" fill="url(#bg)"/>
  <text x="40" y="48" fill="#e2e8f0" font-size="24" font-weight="700">Architecture Viewer — layered visualization (Phase 8E)</text>

  <g font-size="13">
    <rect x="120" y="120" width="220" height="80" rx="12" fill="#1e293b" stroke="#38bdf8"/>
    <text x="150" y="156" fill="#38bdf8" font-weight="700">Frontend</text>
    <rect x="150" y="166" width="70" height="26" rx="6" fill="#0f172a" stroke="#334155"/><text x="185" y="184" fill="#e2e8f0" font-size="11" text-anchor="middle">React</text>
    <rect x="228" y="166" width="96" height="26" rx="6" fill="#0f172a" stroke="#334155"/><text x="276" y="184" fill="#e2e8f0" font-size="11" text-anchor="middle">TypeScript</text>

    <rect x="520" y="110" width="360" height="80" rx="12" fill="#1e293b" stroke="#10b981"/>
    <text x="550" y="150" fill="#10b981" font-weight="700">Backend</text>
    <rect x="560" y="176" width="70" height="26" rx="6" fill="#0f172a" stroke="#334155"/><text x="595" y="184" fill="#e2e8f0" font-size="11" text-anchor="middle">Django</text>
    <rect x="638" y="176" width="96" height="26" rx="6" fill="#0f172a" stroke="#334155"/><text x="686" y="184" fill="#e2e8f0" font-size="11" text-anchor="middle">REST API</text>

    <rect x="920" y="250" width="300" height="80" rx="12" fill="#1e293b" stroke="#a78bfa"/>
