  <text x="330" y="280" fill="#e2e8f0" font-size="16" font-weight="600">Introduction</text>
  <text x="330" y="310" fill="#94a3b8" font-size="13">Django REST Framework is the backbone of many production systems. This article walks through versioning, pagination, filtering, authentication and throttling.</text>
  <rect x="330" y="330" width="620" height="90" rx="10" fill="#0f172a" stroke="#334155"/>
