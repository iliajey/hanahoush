  <text x="360" y="384" fill="#94a3b8" font-size="12" font-family="monospace">    queryset = Article.objects.all()</text>
  <text x="900" y="362" fill="#f59e0b" font-size="11" text-anchor="middle">python · Copy</text>
  <text x="330" y="444" fill="#e2e8f0" font-size="15" font-weight="600">Versioning</text>
  <text x="330" y="472" fill="#94a3b8" font-size="13">Namespace versioning keeps the API stable across releases.</text>
