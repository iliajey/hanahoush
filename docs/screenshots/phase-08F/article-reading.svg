<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" font-family="Inter, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient>
  </defs>
  <rect width="1280" height="480" fill="url(#bg)"/>
  <text x="40" y="48" fill="#e2e8f0" font-size="24" font-weight="700">Article reading experience (Phase 8F)</text>

  <rect x="40" y="90" width="200" height="340" rx="14" fill="#0f172a" stroke="#38bdf8"/>
  <text x="140" y="130" fill="#38bdf8" font-size="14" font-weight="700" text-anchor="middle">On this page</text>
  <text x="60" y="164" fill="#94a3b8" font-size="12">Introduction</text>
  <text x="80" y="190" fill="#94a3b8" font-size="12">Versioning</text>
  <text x="80" y="216" fill="#94a3b8" font-size="12">Security</text>
  <text x="60" y="242" fill="#94a3b8" font-size="12">Performance</text>
  <text x="60" y="300" fill="#64748b" font-size="11">Meta · Author · date · reading time</text>
  <text x="60" y="330" fill="#64748b" font-size="11">Share · Copy link</text>

  <rect x="280" y="90" width="640" height="340" rx="14" fill="#1e293b" stroke="#334155"/>
  <text x="310" y="130" fill="#fbbf24" font-size="16" font-weight="600">Reading progress ▓▓▓░░░░</text>
  <text x="310" y="170" fill="#e2e8f0" font-size="15" font-weight="600">Introduction</text>
  <text x="310" y="200" fill="#94a3b8" font-size="13">Comfortable measure (~66ch). No long lines on desktop. Paragraphs, lists and links preserve the magazine feel.</text>
  <rect x="310" y="230" width="580" height="100" rx="10" fill="#0f172a" stroke="#334155"/>
  <text x="340" y="262" fill="#f59e0b" font-size="11">javascript · Copy</text>
  <text x="340" y="290" fill="#cbd5e1" font-size="12" font-family="monospace">export const api = axios.create({ baseURL: ... })</text>
  <text x="340" y="314" fill="#cbd5e1" font-size="12" font-family="monospace">// code blocks scroll horizontally on mobile</text>
  <text x="310" y="366" fill="#e2e8f0" font-size="14" font-weight="600">Security</text>
  <text x="310" y="392" fill="#94a3b8" font-size="13">Always sanitize content and throttle endpoints.</text>

  <rect x="960" y="90" width="280" height="340" rx="14" fill="#0f172a" stroke="#334155"/>
  <text x="1100" y="130" fill="#e2e8f0" font-size="14" font-weight="700" text-anchor="middle">Reading tools</text>
  <text x="990" y="164" fill="#94a3b8" font-size="12">· fixed progress bar</text>
  <text x="990" y="190" fill="#94a3b8" font-size="12">· sticky TOC</text>
  <text x="990" y="216" fill="#94a3b8" font-size="12">· code language + copy</text>
  <text x="990" y="242" fill="#94a3b8" font-size="12">· share / copy link</text>
  <text x="990" y="290" fill="#64748b" font-size="11">Mobile: collapsible TOC,</text>
  <text x="990" y="314" fill="#64748b" font-size="11">floating share, code scrolls</text>

  <text x="40" y="460" fill="#64748b" font-size="12">accessibility: semantic article · heading hierarchy · keyboard nav · focus states · screen-reader labels · reduced motion</text>
