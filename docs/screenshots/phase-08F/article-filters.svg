<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" font-family="Inter, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient>
  </defs>
  <rect width="1280" height="520" fill="url(#bg)"/>
  <text x="40" y="48" fill="#e2e8f0" font-size="24" font-weight="700">Article discovery — server-side filters (Phase 8F)</text>

  <rect x="40" y="90" width="1200" height="80" rx="14" fill="#1e293b" stroke="#38bdf8"/>
  <g font-size="12.5">
    <rect x="70" y="112" width="300" height="36" rx="8" fill="#0f172a" stroke="#334155"/><text x="220" y="135" fill="#e2e8f0" text-anchor="middle">🔍 Search articles…</text>
    <rect x="382" y="112" width="170" height="36" rx="8" fill="#0f172a" stroke="#334155"/><text x="467" y="135" fill="#e2e8f0" text-anchor="middle">Category ▾</text>
    <rect x="564" y="112" width="150" height="36" rx="8" fill="#0f172a" stroke="#334155"/><text x="639" y="135" fill="#e2e8f0" text-anchor="middle">Topic ▾</text>
    <rect x="726" y="112" width="180" height="36" rx="8" fill="#0f172a" stroke="#334155"/><text x="816" y="135" fill="#e2e8f0" text-anchor="middle">Sort: Newest ▾</text>
    <rect x="918" y="112" width="150" height="36" rx="8" fill="#0f172a" stroke="#334155"/><text x="993" y="135" fill="#e2e8f0" text-anchor="middle">☑ Featured</text>
    <rect x="1080" y="112" width="130" height="36" rx="8" fill="#0f172a" stroke="#334155"/><text x="1145" y="135" fill="#e2e8f0" text-anchor="middle">Clear ✕</text>
  </g>

  <text x="70" y="220" fill="#94a3b8" font-size="13">q → /api/v1/articles/?q= · category → ?category_slug= · topic → ?tags= · featured → ?is_featured= · sort → ?ordering= · page → ?page=&page_size=</text>
  <text x="70" y="246" fill="#64748b" font-size="12">No client-side filtering of the entire database — the backend does the work (MultiFieldSearchFilter + FilterSet).</text>

  <rect x="40" y="280" width="380" height="150" rx="12" fill="#1e293b" stroke="#334155"/>
  <rect x="60" y="296" width="340" height="40" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="230" y="322" fill="#e2e8f0" font-size="13" text-anchor="middle">Django Guide — search "Django"</text>
  <rect x="60" y="344" width="340" height="40" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="230" y="370" fill="#e2e8f0" font-size="13" text-anchor="middle">React at Scale — category Technology</text>
  <rect x="60" y="392" width="340" height="30" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="230" y="412" fill="#94a3b8" font-size="12" text-anchor="middle">2 article(s)</text>

  <rect x="440" y="280" width="380" height="150" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="460" y="310" fill="#e2e8f0" font-size="14" font-weight="600">Load more (pagination)</text>
  <text x="460" y="340" fill="#94a3b8" font-size="12.5">?page=2 — server-side pages, standard envelope pagination metadata</text>
  <rect x="460" y="380" width="120" height="36" rx="8" fill="#334155"/>
  <text x="520" y="403" fill="#e2e8f0" font-size="12" text-anchor="middle">Load more</text>

  <rect x="840" y="280" width="400" height="150" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="860" y="310" fill="#e2e8f0" font-size="14" font-weight="600">Analytics on filters</text>
  <text x="860" y="340" fill="#94a3b8" font-size="12.5">article_search · article_filter · category_click · tag_click</text>
  <text x="860" y="380" fill="#64748b" font-size="11.5">empty state: "No articles match the current filters."</text>
</svg>