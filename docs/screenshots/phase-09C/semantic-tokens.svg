<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" font-family="Inter, Segoe UI, sans-serif">
<rect width="1200" height="820" fill="#ffffff"/>
<text x="48" y="52" font-size="28" font-weight="800" fill="#1F1853">Semantic token themes</text>
<text x="48" y="78" font-size="14" fill="#6b5a6e">Light and dark theme surfaces, text and status tokens wired through the one CSS-variable pipeline (hsl(var(--…))).</text>
